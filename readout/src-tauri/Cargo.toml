[package]
name = "ztg-readout"
version = "0.2.0"
description = "ZTG Readout: a source-faithful Markdown editor and viewer"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "ztg_readout_lib"
path = "src/lib.rs"

[[bin]]
name = "ztg-readout"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
