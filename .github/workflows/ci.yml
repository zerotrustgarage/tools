name: CI

# Checks only. No secrets, no signing environment, no releases.
# The repository is public, so every job runs on GitHub-hosted runners (free for public
# repositories, and isolated from the organization's network). The organization's self-hosted
# pool must never serve this repository: anyone can open a pull request here. The Windows
# executable is cross-compiled on Linux, as the release does, and then installed and launched on
# a real Windows runner.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main always finish, so every commit on
# main gets a result even when several tools push in quick succession.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Readout editor (typecheck, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # .npmrc sets ignore-scripts: no dependency install script runs anywhere in CI.
      - run: npm ci
      - run: npm run check --workspace @ztg-tools/readout
      - run: npm run build --workspace @ztg-tools/readout
      - run: npm audit --omit=dev --audit-level=high

  rust:
    name: Readout desktop shell (Rust tests, clippy, fmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Linux WebView build dependencies
        run: scripts/ci/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      # tauri::generate_context! embeds the built frontend, so it must exist before cargo runs.
      - run: npm ci && npm run build --workspace @ztg-tools/readout
      - run: ../../scripts/ci/install-rust.sh
        working-directory: readout/src-tauri
      - run: cargo fmt --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
        working-directory: readout/src-tauri

  windows:
    name: Readout Windows build (cross-compiled, unsigned)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: scripts/ci/apt-install.sh clang lld llvm
      - run: npm ci
      - run: scripts/ci/build-windows.sh readout
      - run: scripts/ci/check-pe.sh readout/src-tauri/target/x86_64-pc-windows-msvc/release/ztg-readout.exe gui amd64
      # The same installers the release builds, unsigned, for the Windows job below. They are staged
      # in out/, not a dot directory: upload-artifact skips hidden paths.
      - run: scripts/ci/apt-install.sh nsis wixl msitools
      - name: Unsigned installers
        run: |
          set -eu
          mkdir -p out
          exe=readout/src-tauri/target/x86_64-pc-windows-msvc/release/ztg-readout.exe
          cp "$exe" out/
          node scripts/notices.mjs readout out/THIRD-PARTY-NOTICES.txt
          makensis -V2 -DVERSION=0.0.0 "-DAPP_EXE=$PWD/$exe" "-DNOTICES=$PWD/out/THIRD-PARTY-NOTICES.txt" \
            "-DOUTFILE=$PWD/out/ZTG-Readout-Setup.exe" readout/installer/ztg-readout.nsi
          readout/installer/build-msi.sh "$exe" out/THIRD-PARTY-NOTICES.txt 0.0.0 out/ZTG-Readout.msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readout-windows-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 3

  windows-install:
    name: Readout on real Windows (install, launch, open a file, uninstall)
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: readout-windows-unsigned
          path: release
      - name: Install, launch and uninstall both installers
        shell: pwsh
        run: |
          Copy-Item readout/test/corpus/ai-report.md "$env:RUNNER_TEMP/sample.md"
          ./scripts/ci/test-installer-windows.ps1 -Setup release/ZTG-Readout-Setup.exe -Msi release/ZTG-Readout.msi -Sample "$env:RUNNER_TEMP/sample.md" -Shots shots
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readout-windows-screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

  palette:
    name: ZTG palette (every tool matches design-tokens.json)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node scripts/ci/check-palette.mjs

  signing:
    name: Signing and installer mechanics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: scripts/ci/apt-install.sh nsis osslsigncode
      - run: node scripts/signing/sign.mjs check
      # A throwaway test CA stands in for Azure; no credential is involved.
      - run: npm run test:signing
