name: Scanner

# ZTG Scanner checks: CLI and engine (scanner/), desktop app (scanner/app/) and its UI.
# Like ci.yml, every job runs on GitHub-hosted runners (the repository is public; the
# organization's self-hosted pool must never serve it), actions are pinned by commit SHA,
# Go comes from go.dev verified against a committed checksum, and no secret is used.
on:
  pull_request:
    paths: ['scanner/**', '.github/workflows/scanner.yml', '.github/workflows/release-scanner.yml', 'scripts/signing/**', 'scripts/ci/check-pe.sh']
  push:
    branches: [main]
    paths: ['scanner/**', '.github/workflows/scanner.yml', '.github/workflows/release-scanner.yml', 'scripts/signing/**', 'scripts/ci/check-pe.sh']

permissions:
  contents: read

# As in ci.yml: superseded pull request runs are cancelled; runs on main always finish.
concurrency:
  group: scanner-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Scanner engine and CLI (fmt, vet, race tests, cross builds)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/install-go.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet (linux, windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: test
        run: go test -race ./...
      - name: cross builds
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/ztg-scanner
          done

  app:
    name: Scanner desktop app (fmt, vet, tests, Windows build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scanner/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: ../ci/install-go.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet (linux, windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
      - name: test
        run: go test -race ./...
      # The release build path: manifest, version resource and icon embedded (winres/).
      # check-pe.sh uses coreutils only; the pool has no `file` command.
      - name: Windows build (cross-compiled, unsigned)
        run: |
          ./build-windows.sh 0.0.0-ci amd64 dist
          ../../scripts/ci/check-pe.sh dist/ZTGScanner.exe gui amd64
          ../../scripts/ci/check-pe.sh dist/ztg-scanner.exe console amd64
      - name: Reproducible executable builds
        run: |
          ./build-windows.sh 0.0.0-ci amd64 "$RUNNER_TEMP/scanner-rebuild"
          cmp dist/ZTGScanner.exe "$RUNNER_TEMP/scanner-rebuild/ZTGScanner.exe"
          cmp dist/ztg-scanner.exe "$RUNNER_TEMP/scanner-rebuild/ztg-scanner.exe"
      - name: Inventory and package
        run: |
          node --test ../ci/metadata.test.mjs
          node ../ci/metadata.mjs dist 0.0.0
          cp ../installer/README.txt dist/
          ../../scripts/ci/apt-install.sh wixl msitools osslsigncode zip unzip
          SCANNER_PAYLOAD="$PWD/dist" node --test ../ci/packaging.test.mjs
          ../installer/build-msi.sh dist 0.0.0 dist/ZTG-Scanner.msi
          ../installer/build-msi.sh dist 0.0.1 dist/ZTG-Scanner-upgrade.msi
          ../installer/portable.sh dist dist/ZTG-Scanner-portable.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanner-windows-unsigned
          path: scanner/app/dist/
          if-no-files-found: error
          retention-days: 3

  windows-install:
    name: Scanner on Windows (portable, install, launch, upgrade, uninstall)
    needs: app
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanner-windows-unsigned
          path: dist
      - shell: pwsh
        run: >-
          ./scanner/ci/test-windows.ps1 -Msi dist/ZTG-Scanner.msi
          -UpgradeMsi dist/ZTG-Scanner-upgrade.msi
          -Portable dist/ZTG-Scanner-portable.zip -Version 0.0.0-ci

  ui:
    name: Scanner desktop UI (headless Chromium, binding mock)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scanner/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Playwright and Chromium
        run: |
          npm install --global --ignore-scripts playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium
      - run: NODE_PATH="$(npm root --global)" node uitest/run.mjs
