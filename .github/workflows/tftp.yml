name: TFTP

on:
  pull_request:
    paths: ['tftp/**', '.github/workflows/tftp.yml', 'scripts/ci/install-go.sh']
  push:
    branches: [main]
    paths: ['tftp/**', '.github/workflows/tftp.yml', 'scripts/ci/install-go.sh']

permissions:
  contents: read

concurrency:
  group: tftp-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: TFTP (fmt, vet, race, fuzz seeds, interop, cross builds)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tftp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ../scripts/ci/install-go.sh
      - name: Interoperability clients
        run: ../scripts/ci/apt-install.sh curl tftp-hpa atftp
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet (Linux and Windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Race tests, decoder fuzz seeds and interoperability
        run: go test -race -v ./...
      - name: Bounded decoder fuzzing
        run: |
          go test ./internal/wire -run '^$' -fuzz '^FuzzDecode$' -fuzztime 10s -parallel 2
          go test ./internal/wire -run '^$' -fuzz '^FuzzOptions$' -fuzztime 10s -parallel 2
          go test ./internal/store -run '^$' -fuzz '^FuzzName$' -fuzztime 10s -parallel 2
          go test ./internal/xfer -run '^$' -fuzz '^FuzzNetascii$' -fuzztime 10s -parallel 2
          go test ./internal/findings -run '^$' -fuzz '^FuzzFindings$' -fuzztime 10s -parallel 2
      - name: Cross builds (unsigned)
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            suffix=""; if [ "${target%/*}" = windows ]; then suffix=.exe; fi
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o "dist/ztg-tftp-${target%/*}-${target#*/}$suffix" ./cmd/ztg-tftp
          done

  windows-uploads:
    name: Windows upload permissions, commit and limits
    runs-on: windows-2025
    defaults:
      run:
        working-directory: tftp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: tftp/go.sum
      - name: Native Windows upload checks
        run: |
          go test -v ./internal/store -run 'TestDrop|TestWindows'
          go test -v ./internal/server -run TestUpload
