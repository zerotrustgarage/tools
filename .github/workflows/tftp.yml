name: TFTP

on:
  pull_request:
    paths: ['tftp/**', '.github/workflows/tftp.yml', 'scripts/ci/install-go.sh', '.github/workflows/release-tftp.yml', 'scripts/updates/**', 'assets/icons/**', 'scripts/ci/check-icons.mjs']
  push:
    branches: [main]
    paths: ['tftp/**', '.github/workflows/tftp.yml', 'scripts/ci/install-go.sh', '.github/workflows/release-tftp.yml', 'scripts/updates/**', 'assets/icons/**', 'scripts/ci/check-icons.mjs']

permissions:
  contents: read

concurrency:
  group: tftp-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: TFTP (fmt, vet, race, fuzz seeds, interop, cross builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tftp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ../scripts/ci/install-go.sh
      - name: Interoperability clients
        run: ../scripts/ci/apt-install.sh curl tftp-hpa atftp
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet (Linux and Windows)
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: Race tests, decoder fuzz seeds and interoperability
        run: go test -race -v ./...
      - name: Bounded decoder fuzzing
        run: |
          # Iteration counts, not wall time: a -fuzztime deadline can end in "context deadline exceeded".
          # Counts are the median final execs of 3 recent green runs, rounded down (runs 40058073696 40038268833 39965993671); timeout-minutes bounds wall time.
          go test ./internal/wire -run '^$' -fuzz '^FuzzDecode$' -fuzztime 370000x -parallel 2
          go test ./internal/wire -run '^$' -fuzz '^FuzzOptions$' -fuzztime 310000x -parallel 2
          go test ./internal/store -run '^$' -fuzz '^FuzzName$' -fuzztime 125000x -parallel 2
          go test ./internal/xfer -run '^$' -fuzz '^FuzzNetascii$' -fuzztime 50000x -parallel 2
          go test ./internal/server -run '^$' -fuzz '^FuzzResolve$' -fuzztime 75000x -parallel 2
          go test ./internal/importer -run '^$' -fuzz '^FuzzScanner$' -fuzztime 20000x -parallel 2
          go test ./internal/findings -run '^$' -fuzz '^FuzzFindings$' -fuzztime 310000x -parallel 2
      - name: Cross builds (unsigned)
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            suffix=""; if [ "${target%/*}" = windows ]; then suffix=.exe; fi
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o "dist/ztg-tftp-${target%/*}-${target#*/}$suffix" ./cmd/ztg-tftp
          done

  windows-uploads:
    name: Windows upload permissions, commit and limits
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tftp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: tftp/go.sum
      - name: Native Windows engine and service checks
        run: |
          go test -v ./internal/store ./internal/service ./internal/session
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v ./internal/server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  desktop:
    name: TFTP desktop, metadata and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci/install-go.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: scripts/ci/apt-install.sh wixl msitools osslsigncode zip unzip
      - name: Desktop checks and Windows builds
        run: |
          set -euo pipefail
          cd tftp/app
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...
          go test -race ./...
          cd ../..
          tftp/app/build-windows.sh 0.3.0 amd64 out/tftp-payload
          tftp/app/build-windows.sh 0.3.0 arm64 out/tftp-arm64
          scripts/ci/check-pe.sh out/tftp-payload/ZTGTFTP.exe gui amd64
          scripts/ci/check-pe.sh out/tftp-payload/ztg-tftp.exe console amd64
          node tftp/ci/metadata.mjs out/tftp-payload 0.3.0
          cp tftp/installer/README.txt out/tftp-payload/
          node --test tftp/ci/metadata.test.mjs
          TFTP_PAYLOAD="$PWD/out/tftp-payload" node --test tftp/ci/packaging.test.mjs
          tftp/installer/build-msi.sh out/tftp-payload 0.3.0 out/tftp-packages/tftp.msi
          tftp/installer/build-msi.sh out/tftp-payload 0.3.1 out/tftp-packages/upgrade.msi
          tftp/installer/portable.sh out/tftp-payload out/tftp-packages/portable.zip
      - name: Desktop UI in Chromium
        run: |
          npm install --global --ignore-scripts playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium
          NODE_PATH="$(npm root --global)" node tftp/app/uitest/run.mjs
          node scripts/ci/check-palette.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tftp-windows-packages
          path: out/tftp-packages/
          if-no-files-found: error

  windows-install:
    name: TFTP Windows install, launch, firewall and service lifecycle
    needs: desktop
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tftp-windows-packages
          path: out/tftp-packages
      - shell: pwsh
        run: ./tftp/ci/test-windows.ps1 -Msi out/tftp-packages/tftp.msi -Portable out/tftp-packages/portable.zip -Version 0.3.0 -UpgradeMsi out/tftp-packages/upgrade.msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tftp-windows-install-logs
          path: ${{ runner.temp }}/tftp-msi-*.log
          if-no-files-found: ignore
